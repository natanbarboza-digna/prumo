# HTTPS in front of the app once the server has a domain (plans 014 and 039).
# Added on top of docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml --env-file .env.production up -d --build
# Only Caddy is reachable from outside (ports 80 and 443).

services:
  app:
    # No public port: only Caddy talks to the app, over the internal network.
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
