# Production on a VPS (plans 014 and 039; see docs/deploy.md).
#
# Without a domain, the app answers by the server's IP over plain HTTP:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# With a domain, Caddy adds HTTPS and takes the app's public port away:
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml --env-file .env.production up -d --build
#
# Both use the same project and database volume: switching keeps the data. The
# database is never reachable from outside.
name: prumo-prod

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations and the default categories, then exits. The app
  # only starts after it succeeds. Also used for `npm run auth:create-user`.
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # "false" only while the server has no domain (plain HTTP by its IP);
      # empty keeps the session cookie Secure (plan 039).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
    ports:
      # http://SERVER-IP without Caddy; docker-compose.caddy.yml removes it.
      - "${APP_PORT:-80}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim Node image has no curl; Node's own fetch does the request.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  pgdata:
